    .remediation-content {

      animation: slideDown 0.3s ease-in-out;
      max-height: 1000px;
      overflow: hidden;
      transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
    }

    .remediation-content.collapse {
      max-height: 0;
      opacity: 0;
      padding: 0 16px;
      overflow: hidden;
    }

    .remediation-content.collapse.show {
      max-height: 1000px;
      opacity: 1;
      padding: 16px;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
